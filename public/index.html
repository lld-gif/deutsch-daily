<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇩🇪 Deutsch – Daily Lesson</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>🇩🇪 Tageslektion</h1>
  <div class="meta" id="dateLine"></div>
</div>

<div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
  <span class="streak" id="streakBadge">🔥 0 days</span>
  <div class="progress-bar" style="flex:1; min-width:100px;">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <span style="font-size:0.75rem; color:var(--muted);" id="progressLabel">Day 1 of 285</span>
</div>

<div class="controls">
  <select id="topicSeed">
    <option value="auto">🎲 Auto topic</option>
    <option value="family_kita">👨‍👩‍👧 Kita & family</option>
    <option value="daily_life">🏠 Daily life</option>
    <option value="grammar_focus">📚 Grammar deep dive</option>
    <option value="emotions">💬 Emotions & expressing yourself</option>
    <option value="professional">💼 Professional German</option>
    <option value="nature_outdoors">🌿 Nature & outdoors</option>
  </select>
  <select id="difficultySelect">
    <option value="B1">B1</option>
    <option value="B1-B2" selected>B1–B2</option>
    <option value="B2">B2</option>
  </select>
  <select id="exerciseCount">
    <option value="10" selected>10 exercises</option>
    <option value="20">20 exercises</option>
  </select>
  <span class="spacer"></span>
  <button class="review-btn" onclick="openReviewDeck()">🔄 Review <span class="word-bank-count" id="srsDueCount" style="display:none">0</span></button>
  <button class="review-btn" onclick="openStats()">📊 Stats</button>
  <button class="review-btn" onclick="openWordBank()" id="wordBankBtn">📖 Word Bank <span class="word-bank-count" id="wbCount" style="display:none">0</span></button>
  <button class="review-btn" onclick="generateReview()">📋 Weekly Review</button>
  <button class="review-btn" id="themeToggle" onclick="toggleTheme()">☀️</button>
  <button class="primary" id="generateBtn" onclick="generateLesson()">Generate Lesson</button>
</div>

<div id="lessonOutput"></div>

<script type="module">
import { buildPrompt, buildReviewPrompt } from './config/prompts.js';
import { MODEL, API_URL, MAX_TOKENS, MAX_TOKENS_20 } from './config/settings.js';
import {
  migrateGlobalKeys, getState, saveState, getTodayHistory, addToHistory,
  getMissedExercises, addMissedExercise, getGrammarHistory, addGrammarHistory,
  getSentenceThemes, addSentenceThemes, getScoreHistory, saveScoreHistory,
  getWordBank, addToWordBank, updateWordBankCount, getWeakGrammarTopics
} from './lib/storage.js';
import { initSRSFields, openReviewDeck, updateDueBadge } from './lib/srs.js';

// Run one-time migration from old flat keys to namespaced keys
migrateGlobalKeys();
// Backfill SRS fields on legacy word bank entries
initSRSFields();

// Detect German voice for dictation exercises
let germanVoiceAvailable = false;
let germanVoice = null;
function detectGermanVoice() {
  const voices = speechSynthesis.getVoices();
  germanVoice = voices.find(v => v.lang.startsWith('de'));
  germanVoiceAvailable = !!germanVoice;
}
if (typeof speechSynthesis !== 'undefined') {
  detectGermanVoice();
  speechSynthesis.onvoiceschanged = detectGermanVoice;
}

function openWordBank() {
  const bank = getWordBank().sort((a, b) => a.de.localeCompare(b.de, 'de'));
  const overlay = document.createElement('div');
  overlay.className = 'word-bank-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  const renderList = (filter = '') => {
    const filtered = filter
      ? bank.filter(w => w.de.toLowerCase().includes(filter) || w.en.toLowerCase().includes(filter))
      : bank;
    if (filtered.length === 0) return '<div class="word-bank-empty">No words found</div>';
    return filtered.map(w =>
      `<div class="word-bank-item${w.kita ? ' wb-kita' : ''}">
        <span class="wb-de">${w.de}</span>
        <span class="wb-en">${w.en}${w.note ? ' · ' + w.note : ''}</span>
        ${w.box ? `<span class="srs-badge">Box ${w.box}</span>` : ''}
        <span class="wb-date">${w.date}</span>
      </div>`
    ).join('');
  };

  overlay.innerHTML = `
    <div class="word-bank-modal">
      <div class="word-bank-header">
        <h2>📖 Word Bank</h2>
        <span style="color:var(--muted);font-size:0.85rem">${bank.length} words</span>
        <button class="word-bank-close" id="wbClose">✕</button>
      </div>
      <div class="word-bank-search">
        <input type="text" id="wbSearch" placeholder="Search words…">
      </div>
      <div class="word-bank-list" id="wbList">${renderList()}</div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('wbClose').onclick = () => overlay.remove();
  document.getElementById('wbSearch').oninput = e => {
    document.getElementById('wbList').innerHTML = renderList(e.target.value.toLowerCase());
  };
  document.getElementById('wbSearch').focus();
}

// ── Heatmap ─────────────────────────────────────────────────────────────
function renderHeatmap(history) {
  // Build a map of YYYY-MM-DD → avg pct
  const dayMap = {};
  for (const h of history) {
    const key = h.date.slice(0, 10);
    if (!dayMap[key]) dayMap[key] = [];
    dayMap[key].push(h.pct);
  }
  for (const k in dayMap) {
    dayMap[k] = Math.round(dayMap[k].reduce((a, b) => a + b, 0) / dayMap[k].length);
  }

  // Build 91-day grid (13 weeks × 7 days), ending today
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const endDay = today.getDay(); // 0=Sun
  const startOffset = 90 + endDay; // align to start of week
  const startDate = new Date(today);
  startDate.setDate(startDate.getDate() - startOffset);

  const weeks = [];
  const monthLabels = [];
  let lastMonth = -1;
  const d = new Date(startDate);

  for (let w = 0; w < 13; w++) {
    const week = [];
    for (let dow = 0; dow < 7; dow++) {
      const key = d.toISOString().slice(0, 10);
      const pct = dayMap[key];
      const isFuture = d > today;
      week.push({ key, pct, isFuture });
      if (dow === 0 && d.getMonth() !== lastMonth) {
        monthLabels.push({ col: w, label: d.toLocaleString('en', { month: 'short' }) });
        lastMonth = d.getMonth();
      }
      d.setDate(d.getDate() + 1);
    }
    weeks.push(week);
  }

  function cellColor(pct) {
    if (pct === undefined) return 'var(--surface2)';
    if (pct >= 90) return 'var(--green)';
    if (pct >= 70) return 'rgba(62,207,142,0.65)';
    if (pct >= 50) return 'rgba(62,207,142,0.4)';
    return 'rgba(62,207,142,0.2)';
  }

  const dayLabels = ['', 'M', '', 'W', '', 'F', ''];
  let html = '<div class="heatmap-wrap"><div class="heatmap-months">';
  // Month labels row
  let colIdx = 0;
  for (let w = 0; w < 13; w++) {
    const ml = monthLabels.find(m => m.col === w);
    html += `<span class="heatmap-month">${ml ? ml.label : ''}</span>`;
  }
  html += '</div><div class="heatmap-body">';
  html += '<div class="heatmap-days">' + dayLabels.map(l => `<span>${l}</span>`).join('') + '</div>';
  html += '<div class="heatmap-grid">';
  for (let w = 0; w < 13; w++) {
    for (let dow = 0; dow < 7; dow++) {
      const cell = weeks[w][dow];
      const color = cell.isFuture ? 'transparent' : cellColor(cell.pct);
      const title = cell.pct !== undefined ? `${cell.key}: ${cell.pct}%` : cell.key;
      html += `<div class="heatmap-cell" style="background:${color}" title="${title}"></div>`;
    }
  }
  html += '</div></div>';
  html += '<div class="heatmap-legend"><span style="color:var(--muted);font-size:0.65rem">Less</span>';
  ['var(--surface2)', 'rgba(62,207,142,0.2)', 'rgba(62,207,142,0.4)', 'rgba(62,207,142,0.65)', 'var(--green)'].forEach(c => {
    html += `<div class="heatmap-cell" style="background:${c}"></div>`;
  });
  html += '<span style="color:var(--muted);font-size:0.65rem">More</span></div></div>';
  return html;
}

function openStats() {
  const history = getScoreHistory();
  const overlay = document.createElement('div');
  overlay.className = 'word-bank-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  const totalLessons = history.length;
  const avgPct = totalLessons ? Math.round(history.reduce((s, h) => s + h.pct, 0) / totalLessons) : 0;
  const state = getState();

  // Grammar performance: group by grammar point, calc avg
  const grammarMap = {};
  for (const h of history) {
    if (!h.grammar) continue;
    if (!grammarMap[h.grammar]) grammarMap[h.grammar] = [];
    grammarMap[h.grammar].push(h.pct);
  }
  const grammarStats = Object.entries(grammarMap).map(([g, scores]) => ({
    grammar: g,
    avg: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length),
    count: scores.length
  })).sort((a, b) => a.avg - b.avg);

  const worst = grammarStats.slice(0, 3);
  const best = grammarStats.slice(-3).reverse();

  // Last 10 lessons table
  const recent = history.slice(-10).reverse();
  const recentRows = recent.map(h => {
    const d = new Date(h.date);
    const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
    const pctColor = h.pct >= 80 ? 'var(--green)' : h.pct >= 60 ? 'var(--accent2)' : 'var(--red)';
    return `<tr>
      <td>${dateStr}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.theme}</td>
      <td style="color:${pctColor};font-weight:600">${h.score}/${h.total} (${h.pct}%)</td>
    </tr>`;
  }).join('');

  const grammarList = (items, emptyMsg) => items.length
    ? items.map(g => `<div class="stats-grammar-item"><span>${g.grammar}</span><span style="font-weight:600">${g.avg}%</span></div>`).join('')
    : `<div style="color:var(--muted);font-size:0.85rem">${emptyMsg}</div>`;

  const heatmapHtml = renderHeatmap(history);

  overlay.innerHTML = `
    <div class="word-bank-modal stats-modal">
      <div class="word-bank-header">
        <h2>📊 Stats</h2>
        <button class="word-bank-close" id="statsClose">✕</button>
      </div>
      <div class="stats-content">
        <div class="stats-summary">
          <div class="stats-box">
            <div class="stats-number">${totalLessons}</div>
            <div class="stats-label">Lessons</div>
          </div>
          <div class="stats-box">
            <div class="stats-number">${avgPct}%</div>
            <div class="stats-label">Avg Score</div>
          </div>
          <div class="stats-box">
            <div class="stats-number">${state.streak || 0}</div>
            <div class="stats-label">Day Streak</div>
          </div>
        </div>
        <div class="stats-section">
          <div class="stats-section-title">Activity</div>
          ${heatmapHtml}
        </div>
        ${grammarStats.length >= 2 ? `
        <div class="stats-section">
          <div class="stats-section-title">Weakest Areas</div>
          ${grammarList(worst, 'Not enough data yet')}
        </div>
        <div class="stats-section">
          <div class="stats-section-title">Strongest Areas</div>
          ${grammarList(best, 'Not enough data yet')}
        </div>` : ''}
        <div class="stats-section">
          <div class="stats-section-title">Recent Lessons</div>
          ${recent.length ? `<table class="stats-table"><thead><tr><th>Date</th><th>Topic</th><th>Score</th></tr></thead><tbody>${recentRows}</tbody></table>` : '<div style="color:var(--muted);font-size:0.85rem">No lessons yet — generate your first one!</div>'}
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('statsClose').onclick = () => overlay.remove();
}

// ── Streak UI ────────────────────────────────────────────────────────────
function updateStreakUI() {
  const today = new Date().toDateString();
  const s = getState();
  if (s.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    s.streak = (s.lastDate === yesterday) ? s.streak + 1 : 1;
    s.dayCount = (s.dayCount || 0) + 1;
    s.lastDate = today;
    saveState(s);
  }
  document.getElementById('streakBadge').textContent = `🔥 ${s.streak} day${s.streak !== 1 ? 's' : ''}`;
  const day = s.dayCount || 1;
  document.getElementById('progressFill').style.width = Math.min((day / 285) * 100, 100) + '%';
  document.getElementById('progressLabel').textContent = `Day ${day} of 285`;
  if (day > 1 && day % 7 === 0) showReviewBanner(day);
}

function showReviewBanner(day) {
  if (document.getElementById('reviewBanner')) return;
  const week = Math.floor(day / 7);
  const b = document.createElement('div');
  b.id = 'reviewBanner'; b.className = 'review-banner';
  b.innerHTML = `<span style="font-size:1.2rem">📋</span><div><strong>Week ${week} complete!</strong> Today is a review day — tap "Weekly Review".</div>`;
  document.querySelector('.controls').insertAdjacentElement('afterend', b);
}

function setDateLine() {
  const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
  document.getElementById('dateLine').textContent = new Date().toLocaleDateString('en-US', opts);
}

// ── API ────────────────────────────────────────────────────────────────────
function getExerciseCount() {
  return parseInt(document.getElementById('exerciseCount').value, 10) || 10;
}
async function callAPI(prompt) {
  const tokens = getExerciseCount() >= 20 ? MAX_TOKENS_20 : MAX_TOKENS;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: MODEL, max_tokens: tokens,
      messages: [{ role: 'user', content: prompt }] })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const raw = data.content.map(b => b.text || '').join('');
  const cleaned = raw.replace(/```json|```/g, '').trim();
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    // Likely truncated by max_tokens — check stop reason
    const stop = data.stop_reason || '';
    if (stop === 'max_tokens' || cleaned.length > 1000) {
      throw new Error('Response was too long and got cut off. Try generating again.');
    }
    throw new Error(`Invalid JSON from API: ${e.message}`);
  }
}

// ── Exercise state ──────────────────────────────────────────────────────────
let currentLesson = null;
let exIndex = 0;
let exResults = [];
let awaitingAnswer = false;
let lastSubmitTime = 0;

// ── Keyboard shortcuts ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Close modals on Escape
  if (e.key === 'Escape') {
    const overlay = document.querySelector('.word-bank-overlay');
    if (overlay) { overlay.remove(); return; }
  }

  // Ignore keyboard shortcuts when typing in an input
  if (document.activeElement?.tagName === 'INPUT') return;

  if (!currentLesson) return;

  // 1-4 for MC options
  if (awaitingAnswer && ['1','2','3','4'].includes(e.key)) {
    const idx = parseInt(e.key) - 1;
    const item = document.getElementById(`mc-${idx}`);
    if (item) { item.click(); return; }
  }

  // Enter for Next Exercise / See Results button
  // Require 300ms after last submit to prevent instant auto-advance
  if (e.key === 'Enter' && !awaitingAnswer && (Date.now() - lastSubmitTime > 300)) {
    const nextBtn = document.querySelector('.next-btn');
    if (nextBtn) { nextBtn.click(); return; }
  }
});

function renderLesson(lesson, isReview) {
  currentLesson = lesson;
  exIndex = 0;
  exResults = [];

  // Save vocab to word bank (feature 7)
  if (lesson.vocab) addToWordBank(lesson.vocab);

  // Track sentence themes (feature 4)
  if (lesson.sentences) addSentenceThemes(lesson.sentences);

  const out = document.getElementById('lessonOutput');
  let html = '';

  // Tags
  html += `<div style="margin-bottom:16px;">
    <span class="tag level">${lesson.level}</span>
    ${isReview ? '<span class="tag review">📋 Weekly Review</span>' : '<span class="tag grammar">Grammar</span><span class="tag vocab">Vocab</span>'}
    <span style="font-size:0.9rem;font-weight:600;color:var(--text);">${lesson.theme}</span>
  </div>`;

  // Grammar
  html += `<div class="lesson-card">
    <div class="section-label">${isReview ? 'Review Summary' : 'Grammar Point'}</div>
    <div class="grammar-block">
      <div class="grammar-title">${lesson.grammar.title}</div>
      <div class="grammar-body">
        ${lesson.grammar.explanation}
        <div class="formula">${lesson.grammar.formula}</div>
        💡 <em>${lesson.grammar.tip}</em>
      </div>
    </div>
  </div>`;

  // Vocab (feature 5: conjugations for verbs)
  html += `<div class="lesson-card">
    <div class="section-label">Vocabulary <span style="color:var(--kita);font-size:0.65rem">● Kita</span></div>
    <div class="vocab-grid">`;
  for (const v of lesson.vocab) {
    let conjugationHtml = '';
    if (v.conjugation) {
      conjugationHtml = `<div class="conjugation-table">
        ${Object.entries(v.conjugation).map(([pron, form]) =>
          `<span class="conj-pronoun">${pron}</span><span class="conj-form">${form}</span>`
        ).join('')}
      </div>`;
    }
    html += `<div class="vocab-item${v.kita ? ' kita' : ''}">
      ${v.kita ? '<span class="kita-badge">KITA</span>' : ''}
      <div class="vocab-de">${v.de}</div>
      <div class="vocab-en">${v.en}</div>
      ${v.note ? `<div class="vocab-note">${v.note}</div>` : ''}
      ${conjugationHtml}
    </div>`;
  }
  html += `</div></div>`;

  // Sentences (feature 4: explanations)
  const sentLabel = isReview ? 'Sentences — spot the error in #1' : 'Example Sentences';
  html += `<div class="lesson-card">
    <div class="section-label">${sentLabel}</div>
    <ul class="sentences-list">`;
  lesson.sentences.forEach((s, i) => {
    const isErr = isReview && i === 0;
    html += `<li class="sentence-item${isErr ? ' error-spot' : ''}">
      ${isErr ? '<div style="font-size:0.7rem;color:var(--red);margin-bottom:4px;font-weight:700;">⚠ CONTAINS AN ERROR — find and fix it</div>' : ''}
      <div class="sentence-de">${s.de}</div>
      <div class="sentence-en">${s.en}</div>
      ${s.explanation ? `<div class="sentence-explanation">💡 ${s.explanation}</div>` : ''}
    </li>`;
  });
  html += `</ul></div>`;

  // Exercises container
  const exCount = lesson.exercises.length;
  html += `<div class="lesson-card" id="exerciseCard">
    <div class="section-label">Exercises</div>
    <div class="exercise-header">
      <span class="exercise-counter" id="exCounter">1 / ${exCount}</span>
      <div class="exercise-dots" id="exDots">
        ${lesson.exercises.map((_,i) => `<div class="exercise-dot${i===0?' active':''}" id="dot-${i}"></div>`).join('')}
      </div>
    </div>
    <div id="exBody"></div>
  </div>

  <div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;">
    <button onclick="generateLesson()" style="background:var(--surface2);color:var(--muted);border-color:var(--border);font-size:0.8rem;padding:8px 20px;">↻ New Lesson</button>
    <button onclick="generateReview()" style="background:rgba(167,139,250,0.1);color:var(--purple);border-color:var(--purple);font-size:0.8rem;padding:8px 20px;">📋 Review</button>
  </div>`;

  out.innerHTML = html;
  renderExercise(0);
}

function renderExercise(idx) {
  const ex = currentLesson.exercises[idx];
  const body = document.getElementById('exBody');
  document.getElementById('exCounter').textContent = `${idx + 1} / ${currentLesson.exercises.length}`;

  currentLesson.exercises.forEach((_, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (i < idx) {
      d.className = 'exercise-dot ' + (exResults[i]?.correct ? 'done-correct' : 'done-wrong');
    } else if (i === idx) {
      d.className = 'exercise-dot active';
    } else {
      d.className = 'exercise-dot';
    }
  });

  const typeBadge = {
    multiple_choice: '<span class="exercise-type-badge badge-mc">Multiple Choice</span>',
    fill_in: '<span class="exercise-type-badge badge-fill">Fill in the Blank</span>',
    sentence_builder: '<span class="exercise-type-badge badge-sb">Sentence Builder</span>',
    dictation: '<span class="exercise-type-badge badge-dict">Dictation</span>',
  }[ex.type] || '';

  let html = typeBadge;

  if (ex.type === 'multiple_choice') {
    html += `<div class="exercise-prompt">${ex.prompt}<br><strong>${ex.question}</strong></div>
    <div class="exercise-items" id="mcItems">`;
    ['1','2','3','4'].forEach((l, i) => {
      html += `<div class="exercise-item" id="mc-${i}" onclick="submitMC(${i},${ex.answer},'${escJS(ex.explanation)}','${escJS(ex.translation || '')}')">
        <div class="option-letter">${l}</div><div>${ex.options[i]}</div>
      </div>`;
    });
    html += `</div><div id="exFeedback"></div>`;

  } else if (ex.type === 'fill_in') {
    const hintHtml = ex.hint ? `<div style="margin-top:6px;font-size:0.9rem;color:var(--muted);font-style:italic">💡 ${ex.hint}</div>` : '';
    html += `<div class="exercise-prompt">${ex.prompt}<br><strong>${ex.question}</strong>${hintHtml}</div>
    <div class="text-input-wrap">
      <input type="text" id="textInput" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')submitText()">
      <button class="primary" onclick="submitText()">Check</button>
    </div><div id="exFeedback"></div>`;

  } else if (ex.type === 'sentence_builder') {
    html += `<div class="exercise-prompt">${ex.prompt}</div>
    <div class="sb-answer" id="sbAnswer"></div>
    <div class="sb-pool" id="sbPool"></div>
    <div style="margin-top:12px">
      <button class="primary" id="sbCheck" onclick="submitSentenceBuilder()" style="width:100%;padding:10px" disabled>Check Order</button>
    </div>
    <div id="exFeedback"></div>`;

  } else if (ex.type === 'dictation') {
    html += `<div class="exercise-prompt">${ex.prompt || 'Listen and type what you hear'}</div>
    <div class="dictation-controls">
      <button class="dictation-play" id="dictPlay" onclick="playDictation()">▶ Play Audio</button>
      <button class="dictation-play dictation-slow" id="dictSlow" onclick="playDictation(true)">🐢 Slow</button>
    </div>
    <div class="text-input-wrap">
      <input type="text" id="textInput" placeholder="Type what you hear…" onkeydown="if(event.key==='Enter')submitDictation()">
      <button class="primary" onclick="submitDictation()">Check</button>
    </div>
    <div id="dictFallback" style="display:none;margin-top:8px;font-size:0.85rem;color:var(--muted)"></div>
    <div id="exFeedback"></div>`;
  }

  body.innerHTML = html;
  awaitingAnswer = true;
  if (ex.type === 'fill_in') {
    setTimeout(() => document.getElementById('textInput')?.focus(), 50);
  } else if (ex.type === 'sentence_builder') {
    initSentenceBuilder(ex.scrambled || []);
  } else if (ex.type === 'dictation') {
    setTimeout(() => document.getElementById('textInput')?.focus(), 50);
  }
}

// Feature 2: translation shown in feedback. Feature 3: missed exercises saved.
function submitMC(chosen, correct, explanation, translation) {
  if (exResults.length > exIndex) return; // prevent double-submit
  awaitingAnswer = false;
  lastSubmitTime = Date.now();
  const ex = currentLesson.exercises[exIndex];
  const chosenText = ex.options[chosen];
  const correctText = ex.options[correct];
  const isCorrect = chosen === correct || chosenText === correctText;
  exResults.push({ correct: isCorrect, exercise: ex, userAnswer: chosenText });

  // Feature 3: save missed exercise
  if (!isCorrect) addMissedExercise(ex);

  const items = document.querySelectorAll('.exercise-item');
  items.forEach(el => el.onclick = null);
  document.getElementById(`mc-${correct}`).classList.add('revealed');

  const translationHtml = translation ? `<div class="exercise-translation">📝 ${translation}</div>` : '';

  if (!isCorrect) {
    document.getElementById(`mc-${chosen}`).classList.add('wrong');
    const correctText = items[correct].querySelector('div:last-child').textContent;
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback wrong">
        <strong>✗ Not quite.</strong> The correct answer is <strong>${correctText}</strong>.<br>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:4px;display:block">${explanation}</span>
      </div>${translationHtml}`;
  } else {
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback correct">
        <strong>✓ Correct!</strong>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:4px;display:block">${explanation}</span>
      </div>${translationHtml}`;
  }
  showNextBtn();
}

function submitText() {
  if (exResults.length > exIndex) return; // prevent double-submit
  const ex = currentLesson.exercises[exIndex];
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if (!val) return;

  const normalise = s => s.toLowerCase().replace(/[.,!?;:'"äöüÄÖÜß]/g, c => {
    const map = {'ä':'ae','ö':'oe','ü':'ue','ß':'ss','Ä':'ae','Ö':'oe','Ü':'ue'};
    return map[c] || c;
  }).replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();

  const correct = ex.correct_answer || ex.correct_sentence || '';
  const alts = ex.alt_answers || [];
  const isCorrect = normalise(val) === normalise(correct) || alts.some(a => normalise(val) === normalise(a));

  input.className = isCorrect ? 'correct' : 'wrong';
  input.disabled = true;
  awaitingAnswer = false;
  lastSubmitTime = Date.now();
  exResults.push({ correct: isCorrect, exercise: ex, userAnswer: val });

  // Feature 3: save missed exercise
  if (!isCorrect) addMissedExercise(ex);

  const translationHtml = ex.translation ? `<div class="exercise-translation">📝 ${ex.translation}</div>` : '';

  if (isCorrect) {
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback correct">
        <strong>✓ Correct!</strong>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:4px;display:block">${ex.explanation}</span>
      </div>${translationHtml}`;
  } else {
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback wrong">
        <strong>✗ Not quite.</strong> You wrote: <em>${val}</em><br>
        <span style="color:var(--green);font-weight:600">✓ Correct answer: ${correct}</span><br>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:6px;display:block">${ex.explanation}</span>
      </div>${translationHtml}`;
  }
  showNextBtn();
}

function showNextBtn() {
  const isLast = exIndex === currentLesson.exercises.length - 1;
  const fb = document.getElementById('exFeedback');
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = isLast ? '🎉 See Results' : 'Next Exercise →';
  btn.onclick = isLast ? showScore : nextExercise;
  fb.appendChild(btn);
}

function nextExercise() {
  exIndex++;
  renderExercise(exIndex);
  document.getElementById('exerciseCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Feature 1: denominator is always currentLesson.exercises.length
function showScore() {
  const total = currentLesson.exercises.length;
  const score = exResults.filter(r => r.correct).length;
  const pct = Math.round((score / total) * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '✅' : pct >= 50 ? '💪' : '📚';

  // Save score history
  saveScoreHistory(currentLesson, score, total, pct);

  const dots = exResults.map(r =>
    `<div class="score-dot" style="background:${r.correct ? 'var(--green)' : 'var(--red)'}"></div>`
  ).join('');

  const mistakes = exResults.filter(r => !r.correct);
  const reviewBtn = mistakes.length > 0
    ? `<button class="review-mistakes-btn" onclick="showMistakeReview()">📝 Review ${mistakes.length} Mistake${mistakes.length > 1 ? 's' : ''}</button>`
    : '';

  document.getElementById('exBody').innerHTML = `
    <div class="score-card">
      <div class="score-big">${emoji} ${score}/${total}</div>
      <div class="score-label">${pct}% — ${pct >= 90 ? 'Ausgezeichnet!' : pct >= 70 ? 'Gut gemacht!' : pct >= 50 ? 'Weiter so!' : 'Keep drilling — you\'ll get there.'}</div>
      <div class="score-dots">${dots}</div>
      ${reviewBtn}
      <button class="primary" onclick="generateLesson()" style="padding:10px 28px">Next Lesson →</button>
    </div>`;

  currentLesson.exercises.forEach((_, i) => {
    const d = document.getElementById(`dot-${i}`);
    if (d) d.className = 'exercise-dot ' + (exResults[i]?.correct ? 'done-correct' : 'done-wrong');
  });
  document.getElementById('exCounter').textContent = `${total} / ${total}`;
}

function showMistakeReview() {
  const mistakes = exResults.filter(r => !r.correct);
  const reviewHtml = mistakes.map((r, i) => {
    const ex = r.exercise;
    const correctAnswer = ex.type === 'multiple_choice'
      ? ex.options[ex.answer]
      : (ex.correct_answer || ex.correct_sentence || '');
    return `<div class="review-item">
      <div class="review-number">${i + 1}</div>
      <div class="review-body">
        <div class="review-question">${ex.question}</div>
        <div class="review-answers">
          <span class="review-wrong">Your answer: ${r.userAnswer}</span>
          <span class="review-correct">Correct: ${correctAnswer}</span>
        </div>
        <div class="review-explanation">${ex.explanation}</div>
        ${ex.translation ? `<div class="exercise-translation">📝 ${ex.translation}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('exBody').innerHTML = `
    <div class="review-panel">
      <div class="review-header">📝 Mistake Review</div>
      ${reviewHtml}
      <div style="text-align:center;margin-top:16px">
        <button class="primary" onclick="generateLesson()" style="padding:10px 28px">Next Lesson →</button>
      </div>
    </div>`;
}

// ── Sentence Builder ────────────────────────────────────────────────────
let sbPoolWords = [];
let sbAnswerWords = [];

function initSentenceBuilder(scrambled) {
  sbPoolWords = scrambled.map((w, i) => ({ text: w, id: i }));
  sbAnswerWords = [];
  renderSBTiles();
}

function renderSBTiles() {
  const pool = document.getElementById('sbPool');
  const answer = document.getElementById('sbAnswer');
  const checkBtn = document.getElementById('sbCheck');
  if (!pool || !answer) return;

  pool.innerHTML = sbPoolWords.map(w =>
    `<button class="tile-btn" onclick="sbTapPool(${w.id})">${w.text}</button>`
  ).join('');

  answer.innerHTML = sbAnswerWords.length === 0
    ? '<span class="sb-placeholder">Tap words to build the sentence…</span>'
    : sbAnswerWords.map(w =>
        `<button class="tile-btn placed" onclick="sbTapAnswer(${w.id})">${w.text}</button>`
      ).join('');

  if (checkBtn) checkBtn.disabled = sbPoolWords.length > 0;
}

function sbTapPool(id) {
  const idx = sbPoolWords.findIndex(w => w.id === id);
  if (idx === -1) return;
  const [word] = sbPoolWords.splice(idx, 1);
  sbAnswerWords.push(word);
  renderSBTiles();
}

function sbTapAnswer(id) {
  const idx = sbAnswerWords.findIndex(w => w.id === id);
  if (idx === -1) return;
  const [word] = sbAnswerWords.splice(idx, 1);
  sbPoolWords.push(word);
  renderSBTiles();
}

function submitSentenceBuilder() {
  if (exResults.length > exIndex) return;
  const ex = currentLesson.exercises[exIndex];
  const userSentence = sbAnswerWords.map(w => w.text).join(' ');
  const correct = ex.correct_sentence || '';

  const norm = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
  const isCorrect = norm(userSentence) === norm(correct);

  awaitingAnswer = false;
  lastSubmitTime = Date.now();
  exResults.push({ correct: isCorrect, exercise: ex, userAnswer: userSentence });

  if (!isCorrect) addMissedExercise(ex);

  // Disable tile buttons
  document.querySelectorAll('.tile-btn').forEach(b => { b.onclick = null; b.style.opacity = '0.6'; });
  document.getElementById('sbCheck').disabled = true;

  const translationHtml = ex.translation ? `<div class="exercise-translation">📝 ${ex.translation}</div>` : '';

  if (isCorrect) {
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback correct">
        <strong>✓ Correct!</strong>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:4px;display:block">${ex.explanation}</span>
      </div>${translationHtml}`;
  } else {
    document.getElementById('exFeedback').innerHTML =
      `<div class="feedback wrong">
        <strong>✗ Not quite.</strong> Your order: <em>${userSentence}</em><br>
        <span style="color:var(--green);font-weight:600">✓ Correct: ${correct}</span><br>
        <span style="font-size:0.82rem;opacity:0.9;margin-top:6px;display:block">${ex.explanation}</span>
      </div>${translationHtml}`;
  }
  showNextBtn();
}

// ── Dictation exercise ──────────────────────────────────────────────────────
function playDictation(slow = false) {
  const ex = currentLesson.exercises[exIndex];
  const sentence = ex.sentence || ex.correct_answer || '';
  if (!sentence) return;
  try {
    const utter = new SpeechSynthesisUtterance(sentence);
    utter.lang = 'de-DE';
    utter.rate = slow ? 0.6 : 0.85;
    if (germanVoice) utter.voice = germanVoice;
    utter.onerror = () => {
      const fb = document.getElementById('dictFallback');
      if (fb) { fb.style.display = 'block'; fb.textContent = '⚠ Audio failed. Sentence: ' + sentence; }
    };
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
  } catch {
    const fb = document.getElementById('dictFallback');
    if (fb) { fb.style.display = 'block'; fb.textContent = '⚠ Audio not available. Sentence: ' + sentence; }
  }
}

      </div>${translationHtml}`;

// ── Theme toggle ────────────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('de_theme');
  if (saved === 'light') {
    document.body.classList.add('light-mode');
  }
  updateThemeButton();
}

function toggleTheme() {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('de_theme', isLight ? 'light' : 'dark');
  updateThemeButton();
}

function updateThemeButton() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  btn.textContent = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
}

function escJS(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,''); }

// ── Generate ────────────────────────────────────────────────────────────────
async function generateLesson() {
  const btn = document.getElementById('generateBtn');
  const topic = document.getElementById('topicSeed').value;
  const difficulty = document.getElementById('difficultySelect').value;
  const exerciseCount = getExerciseCount();
  btn.disabled = true;
  document.getElementById('lessonOutput').innerHTML = `<div class="loading"><div class="spinner"></div>Generating your lesson…</div>`;
  try {
    const lesson = await callAPI(buildPrompt(topic, difficulty, getTodayHistory(), {
      exerciseCount,
      missedExercises: getMissedExercises().slice(-5),
      grammarHistory: getGrammarHistory(),
      sentenceThemes: getSentenceThemes(),
      weakGrammar: getWeakGrammarTopics(),
      hasGermanVoice: germanVoiceAvailable
    }));
    addToHistory(lesson.theme, lesson.grammar?.title);
    addGrammarHistory(lesson.grammar?.title);
    renderLesson(lesson, false);
  } catch(e) {
    document.getElementById('lessonOutput').innerHTML = `<div class="error">Failed: ${e.message}<br><button class="retry-btn" onclick="generateLesson()">↻ Try Again</button></div>`;
  } finally { btn.disabled = false; }
}

async function generateReview() {
  const difficulty = document.getElementById('difficultySelect').value;
  const exerciseCount = getExerciseCount();
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('lessonOutput').innerHTML = `<div class="loading"><div class="spinner"></div>Building weekly review…</div>`;
  try {
    const lesson = await callAPI(buildReviewPrompt(difficulty, { exerciseCount, hasGermanVoice: germanVoiceAvailable }));
    renderLesson(lesson, true);
  } catch(e) {
    document.getElementById('lessonOutput').innerHTML = `<div class="error">Failed: ${e.message}<br><button class="retry-btn" onclick="generateReview()">↻ Try Again</button></div>`;
  } finally { document.getElementById('generateBtn').disabled = false; }
}

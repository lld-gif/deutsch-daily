<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇩🇪 Deutsch – Daily Lesson</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222638;
    --border: #2e3248;
    --accent: #4f7ef8;
    --accent2: #f5a623;
    --green: #3ecf8e;
    --red: #f87171;
    --purple: #a78bfa;
    --text: #e2e8f0;
    --muted: #8892a4;
    --kita: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 24px 16px; }

  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
  .header .meta { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

  .progress-bar { background: var(--surface2); border-radius: 8px; height: 6px; margin-bottom: 24px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--kita)); border-radius: 8px; transition: width 0.5s ease; }

  .controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  select, button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; }
  select:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { opacity: 0.9; }
  button.review-btn { background: rgba(167,139,250,0.15); border-color: var(--purple); color: var(--purple); font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }
  .spacer { flex: 1; }

  .review-banner { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.4); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--purple); }

  .lesson-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
  .section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  .grammar-block { border-left: 3px solid var(--accent); padding-left: 14px; margin-bottom: 6px; }
  .grammar-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .grammar-body { font-size: 0.9rem; line-height: 1.6; color: var(--text); }
  .grammar-body .formula { background: var(--surface2); border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-family: monospace; font-size: 0.85rem; color: var(--accent2); }
  .grammar-body em { color: var(--accent2); font-style: normal; font-weight: 600; }

  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media(max-width: 480px) { .vocab-grid { grid-template-columns: 1fr; } }
  .vocab-item { background: var(--surface2); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--border); position: relative; }
  .vocab-item.kita { border-color: var(--kita); }
  .vocab-item .kita-badge { position: absolute; top: 8px; right: 10px; font-size: 0.65rem; color: var(--kita); font-weight: 700; letter-spacing: 0.5px; }
  .vocab-de { font-weight: 700; font-size: 0.95rem; }
  .vocab-en { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .vocab-note { font-size: 0.75rem; color: var(--accent2); margin-top: 3px; }

  .sentences-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .sentence-item { background: var(--surface2); border-radius: 10px; padding: 12px 14px; }
  .sentence-item.error-spot { border: 1px solid rgba(248,113,113,0.4); }
  .sentence-de { font-weight: 600; font-size: 0.95rem; margin-bottom: 3px; }
  .sentence-en { font-size: 0.8rem; color: var(--muted); }

  .exercise-block { }
  .exercise-prompt { font-size: 0.95rem; margin-bottom: 14px; line-height: 1.5; }
  .exercise-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .exercise-item { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 8px; padding: 10px 14px; border: 1px solid var(--border); cursor: pointer; transition: border-color 0.15s; }
  .exercise-item:hover { border-color: var(--accent); }
  .exercise-item.correct { border-color: var(--green); background: rgba(62,207,142,0.08); }
  .exercise-item.wrong { border-color: var(--red); background: rgba(248,113,113,0.08); }
  .exercise-item.revealed { border-color: var(--green); background: rgba(62,207,142,0.08); }
  .option-letter { width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
  .exercise-item.correct .option-letter { background: var(--green); color: #0f1117; }
  .exercise-item.wrong .option-letter { background: var(--red); color: #0f1117; }
  .exercise-item.revealed .option-letter { background: var(--green); color: #0f1117; }
  .feedback { font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-top: 4px; }
  .feedback.correct { background: rgba(62,207,142,0.1); color: var(--green); border: 1px solid rgba(62,207,142,0.3); }
  .feedback.wrong { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }

  .loading { text-align: center; padding: 48px 24px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 10px; padding: 16px; color: var(--red); font-size: 0.9rem; margin-bottom: 16px; }
  .streak { display: inline-flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; color: var(--accent2); font-weight: 600; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 20px; margin-right: 6px; }
  .tag.grammar { background: rgba(79,126,248,0.15); color: var(--accent); border: 1px solid rgba(79,126,248,0.3); }
  .tag.vocab { background: rgba(245,166,35,0.15); color: var(--accent2); border: 1px solid rgba(245,166,35,0.3); }
  .tag.level { background: rgba(62,207,142,0.15); color: var(--green); border: 1px solid rgba(62,207,142,0.3); }
  .tag.review { background: rgba(167,139,250,0.15); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
</style>
</head>
<body>

<div class="header">
  <h1>🇩🇪 Tageslektion</h1>
  <div class="meta" id="dateLine"></div>
</div>

<div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
  <span class="streak" id="streakBadge">🔥 0 days</span>
  <div class="progress-bar" style="flex:1; min-width:100px;">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <span style="font-size:0.75rem; color:var(--muted);" id="progressLabel">Day 1 of 285</span>
</div>

<div class="controls">
  <select id="topicSeed">
    <option value="auto">🎲 Auto topic</option>
    <option value="family_kita">👨‍👩‍👧 Kita & family</option>
    <option value="daily_life">🏠 Daily life</option>
    <option value="grammar_focus">📚 Grammar deep dive</option>
    <option value="emotions">💬 Emotions & expressing yourself</option>
    <option value="professional">💼 Professional German</option>
    <option value="nature_outdoors">🌿 Nature & outdoors</option>
  </select>
  <select id="difficultySelect">
    <option value="B1">B1</option>
    <option value="B1-B2" selected>B1–B2</option>
    <option value="B2">B2</option>
  </select>
  <span class="spacer"></span>
  <button class="review-btn" onclick="generateReview()">📋 Weekly Review</button>
  <button class="primary" id="generateBtn" onclick="generateLesson()">Generate Lesson</button>
</div>

<div id="lessonOutput"></div>

<script>
const API_URL = "https://api.anthropic.com/v1/messages";

function getState() {
  try {
    const s = localStorage.getItem('de_lesson_state');
    return s ? JSON.parse(s) : { streak: 0, lastDate: null, dayCount: 0 };
  } catch { return { streak: 0, lastDate: null, dayCount: 0 }; }
}
function saveState(s) {
  try { localStorage.setItem('de_lesson_state', JSON.stringify(s)); } catch {}
}
function updateStreakUI() {
  const today = new Date().toDateString();
  const s = getState();
  if (s.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    s.streak = (s.lastDate === yesterday) ? s.streak + 1 : 1;
    s.dayCount = (s.dayCount || 0) + 1;
    s.lastDate = today;
    saveState(s);
  }
  document.getElementById('streakBadge').textContent = `🔥 ${s.streak} day${s.streak !== 1 ? 's' : ''}`;
  const day = s.dayCount || 1;
  document.getElementById('progressFill').style.width = Math.min((day / 285) * 100, 100) + '%';
  document.getElementById('progressLabel').textContent = `Day ${day} of 285`;
  // Auto-trigger review banner on day 7, 14, 21...
  if (day > 1 && day % 7 === 0) {
    showReviewBanner(day);
  }
}

function showReviewBanner(day) {
  const week = Math.floor(day / 7);
  const existing = document.getElementById('reviewBanner');
  if (existing) return;
  const banner = document.createElement('div');
  banner.id = 'reviewBanner';
  banner.className = 'review-banner';
  banner.innerHTML = `<span style="font-size:1.2rem;">📋</span><div><strong>Week ${week} complete!</strong> Today is a review day — tap "Weekly Review" to check your gaps instead of a new lesson.</div>`;
  document.querySelector('.controls').insertAdjacentElement('afterend', banner);
}

function setDateLine() {
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('dateLine').textContent = new Date().toLocaleDateString('en-US', opts);
}

function buildReviewPrompt(difficulty) {
  return `You are a German language tutor. Generate a 15-minute WEEKLY REVIEW session for an adult learner at ${difficulty} level targeting B1 to B2 by end of year.

LEARNER PROFILE:
- Son named Walter attends Kita (German preschool)
- Documented gaps: Konjunktiv II (writes "wurde" instead of "wuerde"), seit + Praesens (defaults to English perfect), chained dass-clauses (verb-final breaks down in linked clauses), two-way prepositions and case switch, fixed verb+preposition pairs (sich erinnern an etc.), 3rd person singular conjugation (er putze instead of er putzt), noun capitalisation

This is a weekly review checkpoint - test across ALL priority gaps, not just one.

Return ONLY valid JSON (no markdown, no preamble):
{
  "level": "${difficulty}",
  "theme": "Weekly Review - Gap Check",
  "grammar": {
    "title": "Weekly Review",
    "explanation": "Quick recap of your three biggest gaps before the exercises. No new material today - just consolidation.",
    "formula": "wuerde/haette/waere | seit + Praesens | Akk (wohin?) vs Dat (wo?)",
    "tip": "The single most common error: writing wurde when you mean wuerde. One dot changes past fact to hypothetical."
  },
  "vocab": [
    { "de": "German word/phrase", "en": "English", "note": "usage or gender reminder", "kita": false }
  ],
  "sentences": [
    { "de": "A sentence with a deliberate grammar error for the learner to spot and correct", "en": "What this should mean - spot and fix the error" },
    { "de": "Correct sentence using seit + Praesens involving Walter", "en": "English translation" },
    { "de": "Correct Konjunktiv II sentence in a daily-life context", "en": "English translation" }
  ],
  "exercise": {
    "type": "multiple_choice",
    "prompt": "Which sentence is grammatically correct? Three contain errors from your documented gaps.",
    "question": "Identify the correct German sentence:",
    "options": ["option A", "option B", "option C", "option D"],
    "answer": 0,
    "explanation": "Explain why the other three are wrong, naming the specific error type from the learner profile"
  }
}

Rules:
- vocab: exactly 5 items mixing review words from gap areas, 1-2 kita true
- sentences index 0 must contain a deliberate error (wrong tense, wrong case, or dropped preposition)
- exercise wrong options must mirror actual learner errors: wurde/wuerde confusion, dropped prepositions, wrong case after two-way prepositions, er putze instead of er putzt
- Keep it punchy - this is a checkpoint not a new lesson`;
}

function buildPrompt(topic, difficulty) {
  const topicMap = {
    auto: 'choose a topic that mixes practical daily life with useful grammar',
    family_kita: 'Kita preschool routines, child-parent communication, school vocabulary a parent needs',
    daily_life: 'everyday household, routines, errands, food and cooking',
    grammar_focus: 'a key grammar structure at this level - choose something high-value',
    emotions: 'expressing feelings, opinions, agreement and disagreement, small talk',
    professional: 'workplace communication, meetings, emails, colleagues',
    nature_outdoors: 'outdoor activities, seasons, weather, describing environment'
  };
  const topicDesc = topicMap[topic] || topicMap.auto;

  return `You are a German language tutor. Generate a structured 15-minute daily lesson for an adult learner targeting ${difficulty} proficiency by end of year.

LEARNER PROFILE (from diagnostic test):
- Son named Walter attends Kita (German preschool).
- Current level: A2/B1 border. Strong passive comprehension, good subordinate clause instinct.
- 20% of vocabulary must be Kita/family-relevant (preschool routines, child-parent communication, emotions, animals, food, body parts, playground language).

PRIORITY GRAMMAR ARC - address these in order, cycling back regularly:
1. Konjunktiv II (HIGHEST PRIORITY): learner writes "wurde" instead of "wuerde". Drill wuerde/haette/waere forms.
2. Seit + Praesens for ongoing actions: learner defaults to English-style perfect. Internalise "Er geht seit drei Monaten in die Kita."
3. Chained subordinate clauses (dass/weil/obwohl): verb-final breaks in linked clauses. Drill: "Ich habe gehoert, dass X ist und dass Y."
4. Two-way prepositions + case switch (Akkusativ motion vs Dativ location).
5. Fixed verb + preposition pairs (sich erinnern an, warten auf, sich freuen auf/ueber etc.)
6. 3rd person singular verb conjugation (er putzt not er putze).
7. Noun capitalisation and gender.

KNOWN STRENGTHS - use as scaffolding, don't over-drill:
- Subordinate clause word order (obwohl, dass, weil)
- Kita/preschool vocabulary
- Perfekt tense formation (haben/sein + Partizip II)

Topic focus: ${topicDesc}

Return ONLY valid JSON with this exact structure (no markdown, no preamble):
{
  "level": "${difficulty}",
  "theme": "short theme title in English",
  "grammar": {
    "title": "grammar point name",
    "explanation": "2-3 sentence explanation, clear and concise",
    "formula": "pattern formula or key rule as a short string",
    "tip": "one practical tip referencing a specific error from the learner profile"
  },
  "vocab": [
    { "de": "German word/phrase", "en": "English translation", "note": "gender/usage hint or null", "kita": true }
  ],
  "sentences": [
    { "de": "German sentence", "en": "English translation" }
  ],
  "exercise": {
    "type": "multiple_choice",
    "prompt": "exercise instruction in English",
    "question": "German sentence with ___ for the gap",
    "options": ["option A", "option B", "option C", "option D"],
    "answer": 0,
    "explanation": "why this answer is correct, referencing the grammar point"
  }
}

Rules:
- Grammar point must target one of the priority gaps above (rotate, don't repeat consecutively)
- vocab: exactly 5 items, mark kita true for 1-2 Kita-relevant words
- sentences: exactly 3, demonstrating the grammar point; at least 1 usable with Walter
- exercise: 4 options, answer is index 0-3; wrong options reflect learner's known error patterns
- Keep everything practical and immediately usable in daily life or at Kita pickup`;
}

async function callAPI(prompt) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  const raw = data.content.map(b => b.text || '').join('');
  return JSON.parse(raw.replace(/```json|```/g, '').trim());
}

async function generateLesson() {
  const btn = document.getElementById('generateBtn');
  const topic = document.getElementById('topicSeed').value;
  const difficulty = document.getElementById('difficultySelect').value;
  btn.disabled = true;
  const out = document.getElementById('lessonOutput');
  out.innerHTML = `<div class="loading"><div class="spinner"></div>Generating your lesson…</div>`;
  try {
    const lesson = await callAPI(buildPrompt(topic, difficulty));
    renderLesson(lesson, false);
  } catch (e) {
    out.innerHTML = `<div class="error">Failed to generate lesson: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

async function generateReview() {
  const difficulty = document.getElementById('difficultySelect').value;
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  const out = document.getElementById('lessonOutput');
  out.innerHTML = `<div class="loading"><div class="spinner"></div>Building your weekly review…</div>`;
  try {
    const lesson = await callAPI(buildReviewPrompt(difficulty));
    renderLesson(lesson, true);
  } catch (e) {
    out.innerHTML = `<div class="error">Failed to generate review: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderLesson(l, isReview) {
  const out = document.getElementById('lessonOutput');
  let html = '';

  html += `<div style="margin-bottom:16px;">
    <span class="tag level">${l.level}</span>
    ${isReview ? '<span class="tag review">📋 Weekly Review</span>' : '<span class="tag grammar">Grammar</span><span class="tag vocab">Vocab</span>'}
    <span style="font-size:0.9rem; font-weight:600; color:var(--text);">${l.theme}</span>
  </div>`;

  html += `<div class="lesson-card">
    <div class="section-label">${isReview ? 'Review Summary' : 'Grammar Point'}</div>
    <div class="grammar-block">
      <div class="grammar-title">${l.grammar.title}</div>
      <div class="grammar-body">
        ${l.grammar.explanation}
        <div class="formula">${l.grammar.formula}</div>
        💡 <em>${l.grammar.tip}</em>
      </div>
    </div>
  </div>`;

  html += `<div class="lesson-card">
    <div class="section-label">Vocabulary <span style="color:var(--kita);font-size:0.65rem;">● Kita</span></div>
    <div class="vocab-grid">`;
  for (const v of l.vocab) {
    html += `<div class="vocab-item${v.kita ? ' kita' : ''}">
      ${v.kita ? '<span class="kita-badge">KITA</span>' : ''}
      <div class="vocab-de">${v.de}</div>
      <div class="vocab-en">${v.en}</div>
      ${v.note ? `<div class="vocab-note">${v.note}</div>` : ''}
    </div>`;
  }
  html += `</div></div>`;

  const sentLabel = isReview ? 'Sentences — spot the error in #1' : 'Example Sentences';
  html += `<div class="lesson-card">
    <div class="section-label">${sentLabel}</div>
    <ul class="sentences-list">`;
  for (let i = 0; i < l.sentences.length; i++) {
    const s = l.sentences[i];
    const isErrorSpot = isReview && i === 0;
    html += `<li class="sentence-item${isErrorSpot ? ' error-spot' : ''}">
      ${isErrorSpot ? '<div style="font-size:0.7rem;color:var(--red);margin-bottom:4px;font-weight:700;">⚠ CONTAINS AN ERROR — find and fix it</div>' : ''}
      <div class="sentence-de">${s.de}</div>
      <div class="sentence-en">${s.en}</div>
    </li>`;
  }
  html += `</ul></div>`;

  const ex = l.exercise;
  const letters = ['A','B','C','D'];
  html += `<div class="lesson-card">
    <div class="section-label">Exercise</div>
    <div class="exercise-block">
      <div class="exercise-prompt">${ex.prompt}<br><strong>${ex.question}</strong></div>
      <div class="exercise-items" id="exItems">`;
  for (let i = 0; i < ex.options.length; i++) {
    html += `<div class="exercise-item" id="opt${i}" onclick="checkAnswer(${i}, ${ex.answer}, '${escapeJs(ex.explanation)}')">
      <div class="option-letter">${letters[i]}</div>
      <div>${ex.options[i]}</div>
    </div>`;
  }
  html += `</div><div id="exFeedback"></div></div></div>`;

  html += `<div style="text-align:center; margin-top:8px; display:flex; gap:8px; justify-content:center;">
    <button onclick="generateLesson()" style="background:var(--surface2);color:var(--muted);border-color:var(--border);font-size:0.8rem;padding:8px 20px;">↻ New Lesson</button>
    <button onclick="generateReview()" style="background:rgba(167,139,250,0.1);color:var(--purple);border-color:var(--purple);font-size:0.8rem;padding:8px 20px;">📋 Review</button>
  </div>`;

  out.innerHTML = html;
}

function escapeJs(s) { return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

function checkAnswer(chosen, correct, explanation) {
  const items = document.querySelectorAll('.exercise-item');
  items.forEach(el => el.onclick = null);
  items[correct].classList.add('revealed');
  const fb = document.getElementById('exFeedback');
  if (chosen === correct) {
    items[chosen].classList.add('correct');
    fb.innerHTML = `<div class="feedback correct">✓ Correct! ${explanation}</div>`;
  } else {
    items[chosen].classList.add('wrong');
    fb.innerHTML = `<div class="feedback wrong">✗ Not quite. ${explanation}</div>`;
  }
}

setDateLine();
updateStreakUI();
generateLesson();
</script>
</body>
</html>
